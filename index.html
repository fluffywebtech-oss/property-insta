<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2747cc" />

    <!-- Primary SEO -->
    <title>PropertyInsta — Verified Properties, 3D Tours & Real-Estate Insights</title>
    <meta name="description" content="India’s most visual property platform. Explore RERA-verified listings, 3D virtual tours, reels, AI recommendations and expert real-estate guides across Gurgaon, Delhi NCR and beyond." />
    <meta name="keywords" content="property in India, Gurgaon real estate, RERA verified flats, buy apartment, new launches, 3D virtual tour, property blog, home buying guide, real estate investment" />
    <meta name="author" content="PropertyInsta" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://propertyinsta.in/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PropertyInsta" />
    <meta property="og:title" content="PropertyInsta — Verified Properties, 3D Tours & Real-Estate Insights" />
    <meta property="og:description" content="India’s most visual property platform — RERA-verified listings, 3D virtual tours, reels, AI recommendations and expert real-estate guides." />
    <meta property="og:url" content="https://propertyinsta.in/" />
    <meta property="og:image" content="https://images.unsplash.com/photo-1560518883-ce09059eeffa?w=1200&h=630&fit=crop" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PropertyInsta — Verified Properties, 3D Tours & Real-Estate Insights" />
    <meta name="twitter:description" content="India’s most visual property platform — RERA-verified listings, 3D virtual tours and expert real-estate guides." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1560518883-ce09059eeffa?w=1200&h=630&fit=crop" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Structured data: Organization + WebSite (sitelinks search box) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "RealEstateAgent",
      "name": "PropertyInsta",
      "description": "India’s most visual property platform for RERA-verified listings, 3D virtual tours and real-estate insights.",
      "url": "https://propertyinsta.in/",
      "logo": "https://propertyinsta.in/favicon.svg",
      "areaServed": "IN",
      "sameAs": ["https://twitter.com/propertyinsta"]
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "PropertyInsta",
      "url": "https://propertyinsta.in/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://propertyinsta.in/?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
